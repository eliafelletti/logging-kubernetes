<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Control Panel | Observability</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .chaos-card { border-left: 5px solid #dc3545; }
        .user-card { border-left: 5px solid #0d6efd; }
        #api-response { max-height: 200px; overflow-y: auto; font-size: 0.85rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">🛠️ Flask Microservice - Control Panel</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-7 mb-4">
            <div class="card shadow-sm user-card">
                <div class="card-header bg-white">
                    <h5 class="mb-0">👥 Gestione Utenti (Database)</h5>
                </div>
                <div class="card-body">
                    <form id="createUserForm" class="row g-3 mb-4">
                        <div class="col-md-5">
                            <input type="text" class="form-control" id="username" placeholder="Username" required>
                        </div>
                        <div class="col-md-5">
                            <input type="email" class="form-control" id="email" placeholder="Email" required>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="submit" class="btn btn-primary">Crea</button>
                        </div>
                    </form>

                    <div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-2 p-2 bg-light rounded border">
                        
                        <form id="searchUserForm" class="d-flex align-items-center mb-0">
                            <input type="number" id="searchId" class="form-control form-control-sm me-2" placeholder="Cerca ID..." style="width: 100px;" required>
                            <button type="submit" class="btn btn-sm btn-outline-primary me-1">🔍 Cerca</button>
                            <button type="button" onclick="loadUsers()" class="btn btn-sm btn-outline-secondary" title="Reset vista">✖️</button>
                        </form>

                        <div class="d-flex align-items-center">
                            <label for="delaySelect" class="form-label mb-0 me-2 small text-muted">Latenza (GET):</label>
                            <select id="delaySelect" class="form-select form-select-sm me-2" style="width: 70px;">
                                <option value="0">0s</option>
                                <option value="1">1s</option>
                                <option value="3">3s</option>
                                <option value="5">5s</option>
                            </select>
                            <button onclick="loadUsers()" class="btn btn-sm btn-primary">🔄 Aggiorna Lista</button>
                        </div>
                    </div>

                    <table class="table table-hover table-bordered bg-white">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-5 mb-4">
            <div class="card shadow-sm chaos-card mb-3">
                <div class="card-header bg-white">
                    <h5 class="mb-0">🌪️ Chaos Engineering (Test Grafana)</h5>
                </div>
                <div class="card-body d-grid gap-2">
                    <button onclick="callApi('/api/health', 'GET')" class="btn btn-success text-start">
                        🟢 <b>Health Check:</b> Simula traffico sano (200 OK)
                    </button>
                    
                    <button onclick="callApi('/api/panic', 'GET')" class="btn btn-danger text-start">
                        🔴 <b>Panic:</b> Simula Crash Server (500 Error)
                    </button>
                    
                    <!-- Input Group dinamico per Log Storm -->
                    <div class="input-group">
                        <button onclick="triggerLogStorm()" class="btn btn-info text-start text-white flex-grow-1">
                            ⛈️ <b>Log Storm:</b> Genera log
                        </button>
                        <span class="input-group-text bg-light text-muted border-start-0" style="font-size: 0.85rem;">Quantità</span>
                        <input type="number" id="logCount" class="form-control text-center" value="50" min="1" max="500" style="max-width: 80px;">
                    </div>
                    
                    <!-- Input Group dinamico per CPU Stress -->
                    <div class="input-group">
                        <button onclick="triggerCpuStress()" class="btn btn-dark text-start flex-grow-1">
                            🔥 <b>CPU Stress:</b> Carico CPU
                        </button>
                        <span class="input-group-text bg-light text-muted border-start-0" style="font-size: 0.85rem;">Secondi</span>
                        <input type="number" id="cpuDuration" class="form-control text-center" value="5" min="1" max="60" style="max-width: 80px;">
                    </div>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h6 class="mb-0">📡 Ultima Risposta API</h6>
                </div>
                <div class="card-body p-0">
                    <pre id="api-response" class="bg-dark text-light p-3 m-0 rounded-bottom">In attesa di comandi...</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal per la Modifica Utente -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editUserModalLabel">✏️ Modifica Utente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editUserForm">
                    <input type="hidden" id="editUserId">
                    <div class="mb-3">
                        <label for="editUsername" class="form-label">Username</label>
                        <input type="text" class="form-control" id="editUsername" required>
                    </div>
                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-warning">Salva Modifiche</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadUsers);

    // Funzione generica per chiamare le API del Chaos Panel
    async function callApi(endpoint, method) {
    const responseBox = document.getElementById('api-response');
    responseBox.textContent = `Chiamata in corso verso ${endpoint}...\n`;

    try {
        const res = await fetch(endpoint, { method: method });
        
        // Read the response as text first to handle both JSON and non-JSON responses
        const rawText = await res.text();
        let data;

        try {
            // Try to parse the response as JSON
            data = JSON.parse(rawText);
        } catch (e) {
            // If JSON parsing fails, treat it as plain text
            data = rawText;
        }

        // Display the response depending on its type
        const output = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        
        responseBox.textContent = `Status: ${res.status}\n\n${output}`;
    } catch (error) {
        responseBox.textContent = `Errore di rete: ${error}`;
    }
}

    // Trigger dinamico per Log Storm
    function triggerLogStorm() {
        const count = document.getElementById('logCount').value;
        if(count > 0) {
            callApi(`/api/log_storm?count=${count}`, 'GET');
        } else {
            alert("Inserisci un numero valido di log da generare.");
        }
    }

    // Trigger dinamico per CPU Stress
    function triggerCpuStress() {
        const duration = document.getElementById('cpuDuration').value;
        if(duration > 0) {
            callApi(`/api/stress_cpu?duration=${duration}`, 'GET');
        } else {
            alert("Inserisci un numero valido di secondi.");
        }
    }

    // Carica la tabella utenti (con supporto al delay)
    async function loadUsers() {
        const delay = document.getElementById('delaySelect').value;
        const endpoint = `/api/users${delay > 0 ? '?delay=' + delay : ''}`;
        const responseBox = document.getElementById('api-response');
        
        if(delay > 0) {
            responseBox.textContent = `⏳ Caricamento utenti in corso con ritardo di ${delay} secondi...\nGuarda Grafana!`;
        }

        try {
            const res = await fetch(endpoint);
            const users = await res.json();
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>
                            <button onclick="openEditModal(${user.id}, '${user.username}', '${user.email}')" class="btn btn-sm btn-warning me-1">✏️</button>
                            <button onclick="deleteUser(${user.id})" class="btn btn-sm btn-danger">🗑️</button>
                        </td>
                    </tr>
                `;
            });
            if(delay > 0) {
                responseBox.textContent = `✅ Utenti caricati (Status: ${res.status})`;
            }
        } catch (error) {
            console.error("Errore caricamento utenti", error);
            responseBox.textContent = `Errore caricamento utenti: ${error}`;
        }
    }

    // Ricerca Utente per ID
    document.getElementById('searchUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('searchId').value;
        const responseBox = document.getElementById('api-response');
        
        responseBox.textContent = `🔍 Ricerca utente ID ${id} in corso...`;

        try {
            const res = await fetch(`/api/user/${id}`);
            const data = await res.json();
            const tbody = document.getElementById('usersTableBody');
            
            if (res.ok) {
                tbody.innerHTML = `
                    <tr class="table-info">
                        <td>${data.id}</td>
                        <td>${data.username}</td>
                        <td>${data.email}</td>
                        <td>
                            <button onclick="openEditModal(${data.id}, '${data.username}', '${data.email}')" class="btn btn-sm btn-warning me-1">✏️</button>
                            <button onclick="deleteUser(${data.id})" class="btn btn-sm btn-danger">🗑️</button>
                        </td>
                    </tr>
                `;
                responseBox.textContent = `✅ Utente trovato (Status: ${res.status})\n\n` + JSON.stringify(data, null, 2);
            } else {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Utente non trovato (404)</td></tr>`;
                responseBox.textContent = `❌ Errore: Utente non trovato (Status: ${res.status})`;
            }
        } catch (error) {
            responseBox.textContent = `Errore di rete: ${error}`;
        }
    });

    // Creazione Utente
    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;

        const res = await fetch('/api/user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email })
        });

        if (res.ok) {
            document.getElementById('createUserForm').reset();
            loadUsers();
            document.getElementById('api-response').textContent = `✅ Utente creato con successo!`;
        } else {
            const err = await res.json();
            document.getElementById('api-response').textContent = `❌ Errore: ${err.error}`;
        }
    });

    // Eliminazione Utente
    async function deleteUser(id) {
        if(confirm("Sei sicuro di voler eliminare questo utente?")) {
            await callApi(`/api/user/${id}`, 'DELETE');
            loadUsers(); // Ricarica la tabella dopo l'eliminazione
        }
    }

    // Apre il Modal e precompila i campi
    function openEditModal(id, username, email) {
        document.getElementById('editUserId').value = id;
        document.getElementById('editUsername').value = username;
        document.getElementById('editEmail').value = email;
        
        var editModal = new bootstrap.Modal(document.getElementById('editUserModal'));
        editModal.show();
    }

    // Gestisce l'invio del form di modifica (PUT)
    document.getElementById('editUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('editUserId').value;
        const username = document.getElementById('editUsername').value;
        const email = document.getElementById('editEmail').value;
        const responseBox = document.getElementById('api-response');

        responseBox.textContent = `🔄 Invio modifiche per utente ID ${id}...`;

        try {
            const res = await fetch(`/api/user/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email })
            });

            if (res.ok) {
                const modalElement = document.getElementById('editUserModal');
                const modalInstance = bootstrap.Modal.getInstance(modalElement);
                modalInstance.hide();
                
                loadUsers();
                responseBox.textContent = `✅ Utente ${id} aggiornato con successo!`;
            } else {
                const err = await res.json();
                responseBox.textContent = `❌ Errore durante l'aggiornamento: ${err.error || res.statusText}`;
            }
        } catch (error) {
            responseBox.textContent = `Errore di rete: ${error}`;
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
