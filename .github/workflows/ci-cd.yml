name: Flask Thesis CI/CD

on:
  push:
    branches: [ "development", "master" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'k8s/**'
      - 'scripts/**'
      - '.gitignore'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-playwright
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium
      
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Start Flask Server in Background (SQLite In-Memory)
        env:
          FLASK_ENV: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          PYTHONPATH: app
        run: |
          python app/src/main.py &
          sleep 3
      
      - name: Test with pytest (Unit, PBT, E2E)
        env:
          FLASK_ENV: testing
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          PYTHONPATH: app
          MINIKUBE_URL: http://127.0.0.1:5000
        run: |
          pytest
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-thesis-app:latest
